<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--txt:#e6eaf0;--mut:#8b95a5;--acc:#4cc2ff;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,sans-serif;height:100vh;display:flex}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
#orb{width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.2s}
#orb.listening{background:var(--ok);box-shadow:0 0 12px var(--ok)}#orb.thinking{background:var(--warn);box-shadow:0 0 12px var(--warn);animation:p 1s infinite}
#orb.speaking{background:var(--acc);box-shadow:0 0 14px var(--acc);animation:p .6s infinite}#orb.loading{background:var(--warn)}
@keyframes p{50%{transform:scale(1.35)}}
h1{font-size:18px;margin:0;flex:1}#st{color:var(--mut);font-size:13px}
button,select,input{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--ok);color:#06210f;border-color:var(--ok)}
#log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:75%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#1d4ed8}.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.small{align-self:center;color:var(--mut);font-size:12px;max-width:90%}
.confirm{align-self:center;background:#3b2f0b;border:1px solid var(--warn);padding:12px 16px;border-radius:12px;max-width:90%}
.confirm code{display:block;margin:6px 0;color:#ffe08a;word-break:break-all}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}form input{flex:1}
#side{width:310px;border-left:1px solid var(--line);padding:18px;overflow:auto;background:#0b0e13}
#side h2{font-size:14px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}#side input,#side select{width:100%}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}#side .row input{width:auto}
#save{width:100%;margin-top:18px;background:var(--acc);color:#04202e;border:0;font-weight:600}
#gear{display:none}
@media(max-width:800px){#gear{display:block}#side{display:none;position:fixed;right:0;top:0;bottom:0;z-index:5;box-shadow:-8px 0 24px #000}#side.open{display:block}}
</style></head><body>
<div id="main">
 <header><div id="orb"></div><h1 id="title">Nova</h1><span id="st">idle</span>
  <button id="vbtn">Start listening</button><button id="gear" onclick="document.getElementById('side').classList.toggle('open')">Settings</button></header>
 <div id="log"></div>
 <form id="f"><input id="q" placeholder="Type a message... (or just talk)" autocomplete="off" autofocus>
  <label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="spk" style="width:auto">read aloud</label>
  <button>Send</button></form>
</div>
<div id="side">
 <h2>Settings</h2>
 <label>Language / Sprache</label>
 <select id="language"><option value="en">English</option><option value="de">Deutsch</option></select>
 <label>Name</label><input id="name">
 <label>Wake words (comma separated)</label><input id="wake_words">
 <label>English voice</label><select id="voice_en"></select>
 <label>German voice</label><select id="voice_de"></select>
 <label>Speaking speed: <span id="sv"></span></label><input id="speed" type="range" min="0.7" max="1.4" step="0.05">
 <label>AI model (Ollama name)</label><input id="model">
 <div class="row"><input type="checkbox" id="ask_before_commands"><span>Ask before running PC commands</span></div>
 <div class="row"><input type="checkbox" id="autostart_voice"><span>Start listening automatically</span></div>
 <button id="save">Save and apply</button>
 <p style="color:var(--mut);font-size:12px">Saved changes restart the voice parts for a few seconds.</p>
</div>
<script>
const T="__TOKEN__";let last=0,voiceOn=false,cfg={};
const $=i=>document.getElementById(i),log=$("log");
const post=(u,b)=>fetch(u,{method:"POST",headers:{"X-Token":T,"Content-Type":"application/json"},body:JSON.stringify(b||{})});
function add(cls,txt,el){const d=el||document.createElement("div");d.className="m "+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=1e9;return d}
function confirmBox(cmd){const d=document.createElement("div");d.className="confirm";d.id="cf";
 d.innerHTML="<b>Toni wants to run this command on your PC:</b><code></code>";d.querySelector("code").textContent=cmd;
 for(const [t,y] of [["Allow",1],["Deny",0]]){const b=document.createElement("button");b.textContent=t;b.style.marginRight="8px";
  b.onclick=()=>{post("/api/confirm",{yes:y});d.remove()};d.appendChild(b)}log.appendChild(d);log.scrollTop=1e9}
async function poll(){try{const r=await(await fetch("/api/poll?since="+last)).json();
 for(const e of r.events){last=e.id;
  if(e.kind=="user")add("user",e.text);else if(e.kind=="assistant")add("assistant",e.text);
  else if(e.kind=="tool")add("small","tool: "+e.text);else if(e.kind=="heard")add("small","heard: "+e.text);
  else if(e.kind=="status"||e.kind=="error")add("small",e.text);
  else if(e.kind=="confirm"&&!document.getElementById("cf")&&r.pending)confirmBox(e.text)}
 if(r.pending&&!document.getElementById("cf"))confirmBox(r.pending.cmd);
 $("orb").className=r.state;$("st").textContent=r.state;voiceOn=r.voice_on;
 $("vbtn").textContent=voiceOn?"Stop listening":"Start listening";$("vbtn").className=voiceOn?"on":""}catch(e){$("st").textContent="disconnected"}}
$("vbtn").onclick=()=>post("/api/voice",{on:!voiceOn});
$("f").onsubmit=e=>{e.preventDefault();const t=$("q").value.trim();if(!t)return;$("q").value="";post("/api/chat",{text:t,speak:$("spk").checked})};
const F=["language","name","wake_words","voice_en","voice_de","speed","model","ask_before_commands","autostart_voice"];
async function load(){cfg=await(await fetch("/api/config")).json();
 for(const k of["voice_en","voice_de"]){const s=$(k);s.innerHTML="";cfg.voices.filter(v=>v.startsWith(k.slice(6))).forEach(v=>s.add(new Option(v,v)))}
 for(const k of F){const el=$(k),v=cfg[k];if(el.type=="checkbox")el.checked=v;else el.value=Array.isArray(v)?v.join(", "):v}
 $("sv").textContent=cfg.speed;$("title").textContent=cfg.name;document.title=cfg.name}
$("speed").oninput=()=>$("sv").textContent=$("speed").value;
$("save").onclick=async()=>{const b={};for(const k of F){const el=$(k);b[k]=el.type=="checkbox"?el.checked:el.type=="range"?+el.value:el.value}
 await post("/api/config",b);setTimeout(load,800)};
load();poll();setInterval(poll,700);
</script></body></html>
