<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<style>
:root{--bg:#070a10;--txt:#e8edf5;--mut:#7f8aa0;--acc:#5cc8ff;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,#0f1a2b 0,var(--bg) 70%);color:var(--txt);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 22px;color:var(--mut);font-size:14px}
nav a,nav button{color:var(--mut);text-decoration:none;background:none;border:1px solid #1d2636;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit}
nav a:hover,nav button:hover{color:var(--txt);border-color:var(--acc)}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:820px;padding:0 24px;gap:28px}
#orbwrap{position:relative;width:220px;height:220px}
.ring,#orb{position:absolute;inset:0;border-radius:50%}
#orb{background:radial-gradient(circle at 35% 30%,#8fdcff,#2a7fb8 55%,#0e2e48);box-shadow:0 0 60px #2a7fb855,inset 0 0 40px #0006;transition:filter .4s,box-shadow .4s;filter:saturate(.35) brightness(.7);animation:breathe 5s ease-in-out infinite}
.ring{border:2px solid var(--acc);opacity:0}
#orbwrap.listening #orb{filter:saturate(1) brightness(1);box-shadow:0 0 70px #4ade8066,inset 0 0 40px #0006;animation:breathe 3.5s ease-in-out infinite}
#orbwrap.listening .ring{border-color:var(--ok);animation:ring 3.5s ease-out infinite}
#orbwrap.thinking #orb{filter:hue-rotate(60deg) saturate(1.3);animation:spin 1.2s ease-in-out infinite}
#orbwrap.speaking #orb{filter:saturate(1.4) brightness(1.15);box-shadow:0 0 110px #5cc8ffaa;animation:talk .55s ease-in-out infinite}
#orbwrap.speaking .ring{animation:ring 1.1s ease-out infinite}#orbwrap.speaking .ring.b{animation-delay:.5s}
#orbwrap.loading #orb{filter:saturate(.2) brightness(.6);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.09)}60%{transform:scale(.97)}}
@keyframes spin{50%{transform:scale(.93) rotate(12deg)}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
#name{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--mut)}
#state{height:20px;color:var(--mut);font-size:14px}
#caps{width:100%;min-height:150px;text-align:center}
#you{color:var(--mut);font-style:italic;min-height:26px;margin-bottom:10px}
#nova{font-size:23px;line-height:1.45;transition:opacity .4s}
#heard{color:#4a566b;font-size:13px;height:20px;margin-top:8px}
#confirm{display:none;margin:12px auto 0;max-width:560px;background:#2b2208;border:1px solid var(--warn);border-radius:14px;padding:12px 16px;font-size:14px}
#confirm code{display:block;margin:6px 0;color:#ffe08a;word-break:break-all}
#confirm button{margin:4px 6px 0 0}
footer{width:100%;max-width:760px;padding:14px 24px 26px;display:flex;gap:10px;align-items:center}
#q{flex:1;background:#0d1320;border:1px solid #1d2636;color:var(--txt);border-radius:24px;padding:12px 18px;font:inherit}
#q:focus{outline:none;border-color:var(--acc)}
.btn{background:#0d1320;border:1px solid #1d2636;color:var(--txt);border-radius:50%;width:46px;height:46px;cursor:pointer;font-size:18px}
.btn:hover{border-color:var(--acc)}.btn.on{background:var(--ok);border-color:var(--ok);color:#042010}
#hist{display:none;position:absolute;inset:60px 0 90px;background:#070a10ee;overflow:auto;padding:16px 10%;z-index:3}
#hist div{margin:8px 0;padding:8px 14px;border-radius:12px;max-width:80%;white-space:pre-wrap}
#hist .user{margin-left:auto;background:#17315a}#hist .assistant{background:#111a2b;border:1px solid #1d2636}#hist .tool{color:var(--mut);font-size:12px;background:none}
</style></head><body>
<nav><span><button id="hbtn">Transcript</button></span>
 <span><button id="lang">EN</button> <a href="/workspace">Workspace &rarr;</a> <a href="/workspace#settings">Settings</a></span></nav>
<div id="hist"></div>
<div id="stage">
 <div id="orbwrap" class="idle"><div class="ring"></div><div class="ring b"></div><div id="orb"></div></div>
 <div><div id="name">Nova</div><div id="state"></div></div>
 <div id="caps"><div id="you"></div><div id="nova"></div><div id="heard"></div>
  <div id="confirm"><b id="cqt">Nova wants to run this on your PC:</b><code id="cmd"></code>
   <button class="btn" style="width:auto;border-radius:20px;padding:0 18px;height:36px;font-size:14px" id="yes">Allow</button>
   <button class="btn" style="width:auto;border-radius:20px;padding:0 18px;height:36px;font-size:14px" id="no">Deny</button></div></div>
</div>
<footer><button class="btn" id="mic" title="Listening on/off">&#127908;</button>
 <input id="q" placeholder="Say the name... or type here" autocomplete="off"><button class="btn" id="stop" title="Stop">&#9632;</button></footer>
<script>
const T="__TOKEN__",$=i=>document.getElementById(i);
const api=(p,b)=>fetch(p,{method:b?"POST":"GET",headers:{"X-Token":T,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j});
let last=null,voiceOn=false,vc=null,cfg={},fade;
const LABEL={idle:"paused",listening:"listening",thinking:"thinking...",speaking:"speaking",loading:"waking up..."};
function showNova(t){$("nova").style.opacity=1;$("nova").textContent=t;clearTimeout(fade);fade=setTimeout(()=>$("nova").style.opacity=.55,20000)}
async function poll(){try{
 const r=await api("/api/poll?since="+(last??0));vc=r.voice_chat;
 if(last===null){last=r.last_id;cfg=await api("/api/config");$("name").textContent=cfg.name;document.title=cfg.name;$("lang").textContent=cfg.language.toUpperCase();
  $("q").placeholder="Say \""+cfg.name+"\"... or type here"}
 for(const e of r.events){last=e.id;
  if(e.kind=="user"&&e.chat==vc.chat){$("you").textContent="You: "+e.text}
  else if(e.kind=="assistant"&&e.chat==vc.chat){showNova(e.text)}
  else if(e.kind=="heard"&&e.text){$("heard").textContent="heard: "+e.text}
  else if(e.kind=="error"||e.kind=="status"){$("heard").textContent=e.text}}
 $("orbwrap").className=r.state;$("state").textContent=LABEL[r.state]||r.state;
 voiceOn=r.voice_on;$("mic").className="btn"+(voiceOn?" on":"");
 const c=r.pending;$("confirm").style.display=(c||r.state=="speaking"&&false)?"block":"none";if(c)$("cmd").textContent=c.cmd;
}catch(e){$("state").textContent="disconnected"}}
$("mic").onclick=()=>api("/api/voice",{on:!voiceOn});
$("stop").onclick=()=>api("/api/stop",{});
$("yes").onclick=()=>api("/api/confirm",{yes:1});$("no").onclick=()=>api("/api/confirm",{yes:0});
$("q").onkeydown=e=>{if(e.key=="Enter"&&$("q").value.trim()&&vc){api("/api/send",{project:vc.project,chat:vc.chat,text:$("q").value.trim(),speak:true});$("q").value=""}};
$("lang").onclick=async()=>{const n=cfg.language=="en"?"de":"en";$("lang").textContent="...";await api("/api/config",{language:n});cfg.language=n;setTimeout(()=>$("lang").textContent=n.toUpperCase(),1500)};
$("hbtn").onclick=async()=>{const h=$("hist");if(h.style.display=="block"){h.style.display="none";return}
 const r=await api("/api/chat?project="+encodeURIComponent(vc.project)+"&id="+vc.chat);h.innerHTML="";
 for(const m of r.log){const d=document.createElement("div");d.className=m.kind;d.textContent=m.kind=="tool"?"tool: "+m.text:m.text;h.appendChild(d)}
 h.style.display="block";h.scrollTop=1e9};
poll();setInterval(poll,500);
</script></body></html>
